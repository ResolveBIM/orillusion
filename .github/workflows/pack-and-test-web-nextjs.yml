name: Pack Orillusion and test in web-nextjs

on:
  push:
    branches:
      - '**'

jobs:
  pack-orillusion:
    name: Build and pack @orillusion/core
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: true
    steps:
      - name: Checkout orillusion
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 7

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies (skip electron download)
        run: pnpm install --no-frozen-lockfile

      - name: Create package tarball
        id: pack
        shell: bash
        env:
          FORCE_COLOR: '0'
        run: |
          set -euo pipefail
          # npm pack runs lifecycle scripts (prepack/prepare) which print logs to stdout.
          # Capture only the last line (the tarball filename), strip any CR.
          filename=$(npm pack 2>&1 | tail -n 1 | tr -d '\r')
          mkdir -p artifacts
          mv "$filename" artifacts/
          echo "tarball=artifacts/$filename" >> "$GITHUB_OUTPUT"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: orillusion-tarball
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  test-web-nextjs:
    name: Install tarball in web-nextjs and build
    runs-on: ubuntu-latest
    needs: pack-orillusion
    steps:
      - name: Download tarball artifact
        uses: actions/download-artifact@v4
        with:
          name: orillusion-tarball
          path: orillusion-tarball

      - name: Checkout ResolveBIM/web-nextjs
        uses: actions/checkout@v4
        with:
          repository: ResolveBIM/web-nextjs
          path: web-nextjs
          token: ${{ secrets.WEB_NEXTJS_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-nextjs/package-lock.json

      - name: Install web-nextjs dependencies
        working-directory: web-nextjs
        run: npm install

      - name: Install Orillusion tarball (override in node_modules)
        working-directory: web-nextjs
        shell: bash
        run: |
          set -euo pipefail
          npm uninstall @orillusion/core
          TARBALL=$(ls -1 ../orillusion-tarball/*.tgz | head -n1)
          npm install --no-save "$TARBALL"

      - name: Build web-nextjs
        working-directory: web-nextjs
        run: npm run build

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: pack-orillusion
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get version
        id: get_version
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Create git tag
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git tag -a "v${{ steps.get_version.outputs.version }}" -m "Release v${{ steps.get_version.outputs.version }}"
          git push origin "v${{ steps.get_version.outputs.version }}"

      - name: Download tarball artifact
        uses: actions/download-artifact@v4
        with:
          name: orillusion-tarball
          path: orillusion-tarball

      - name: Get tarball name
        id: get_tarball_name
        run: |
          cd orillusion-tarball
          original_name=$(ls *.tgz)
          tarball_name="orillusion-core-${{ steps.get_version.outputs.version }}.tgz"
          echo "tarball_name=$tarball_name"
          echo "tarball_name=$tarball_name" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          release_name: v${{ steps.get_version.outputs.version }}
          body: |
            Automated release based on commits to resolve-releases.
          draft: false
          prerelease: false
          asset_path: orillusion-tarball/${{ steps.get_tarball_name.outputs.tarball_name }}
          asset_name: ${{ steps.get_tarball_name.outputs.tarball_name }}
          asset_content_type: application/gzip

      - name: Set release as latest
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ steps.create_release.outputs.id }},
              make_latest: 'true'
            })

