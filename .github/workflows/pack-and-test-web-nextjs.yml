name: Pack Orillusion and test in web-nextjs

on:
  push:
    branches:
      - '**'

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '7'
  WEB_NEXTJS_REPO: ResolveBIM/web-nextjs
  WEB_NEXTJS_PATH: web-nextjs
  TARBALL_ARTIFACT_NAME: orillusion-tarball
  TARBALL_DIR: orillusion-tarball
  WEB_NEXTJS_BASE_BRANCH: dev

jobs:
  pack-orillusion:
    name: Build and pack @orillusion/core
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: true
    steps:
      - name: Checkout orillusion
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies (skip electron download)
        run: pnpm install --no-frozen-lockfile

      - name: Create package tarball
        id: pack
        shell: bash
        env:
          FORCE_COLOR: '0'
        run: |
          set -euo pipefail
          # npm pack runs lifecycle scripts (prepack/prepare) which print logs to stdout.
          # Capture only the last line (the tarball filename), strip any CR.
          filename=$(npm pack 2>&1 | tail -n 1 | tr -d '\r')
          mkdir -p artifacts
          mv "$filename" artifacts/
          echo "tarball=artifacts/$filename" >> "$GITHUB_OUTPUT"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARBALL_ARTIFACT_NAME }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  test-web-nextjs:
    name: Install tarball in web-nextjs and build
    runs-on: ubuntu-latest
    needs: pack-orillusion
    steps:
      - name: Download tarball artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARBALL_ARTIFACT_NAME }}
          path: ${{ env.TARBALL_DIR }}

      - name: Checkout web-nextjs
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          repository: ${{ env.WEB_NEXTJS_REPO }}
          path: ${{ env.WEB_NEXTJS_PATH }}
          token: ${{ secrets.WEB_NEXTJS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WEB_NEXTJS_PATH }}/package-lock.json

      - name: Install web-nextjs dependencies
        working-directory: ${{ env.WEB_NEXTJS_PATH }}
        run: npm install

      - name: Install Orillusion tarball (override in node_modules)
        working-directory: ${{ env.WEB_NEXTJS_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          npm uninstall @orillusion/core
          TARBALL=$(ls -1 ../${{ env.TARBALL_DIR }}/*.tgz | head -n1)
          npm install --no-save "$TARBALL"

      - name: Build web-nextjs
        working-directory: ${{ env.WEB_NEXTJS_PATH }}
        run: npm run build

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: pack-orillusion
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tarball_name: ${{ steps.get_tarball_name.outputs.tarball_name }}
      tarball_url: ${{ steps.compose_tarball_url.outputs.tarball_url }}
      tag: ${{ steps.set_tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Get version
        id: get_version
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Set release tag
        id: set_tag
        run: echo "tag=v${{ steps.get_version.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Create git tag
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git tag -a "${{ steps.set_tag.outputs.tag }}" -m "Release ${{ steps.set_tag.outputs.tag }}"
          git push origin "${{ steps.set_tag.outputs.tag }}"

      - name: Download tarball artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARBALL_ARTIFACT_NAME }}
          path: ${{ env.TARBALL_DIR }}

      - name: Get tarball name
        id: get_tarball_name
        run: |
          cd ${{ env.TARBALL_DIR }}
          tarball_name=$(ls *.tgz)
          echo "tarball_name=$tarball_name"
          echo "tarball_name=$tarball_name" >> $GITHUB_OUTPUT

      - name: Compose tarball URL
        id: compose_tarball_url
        run: |
          echo "tarball_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.set_tag.outputs.tag }}/${{ steps.get_tarball_name.outputs.tarball_name }}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.set_tag.outputs.tag }}
          name: ${{ steps.set_tag.outputs.tag }}
          body: |
            Automated release based on commits to resolve-releases.
          draft: false
          prerelease: false
          files: |
            ${{ env.TARBALL_DIR }}/${{ steps.get_tarball_name.outputs.tarball_name }}
          make_latest: true

  open-web-nextjs-pr:
    name: Open PR in web-nextjs
    runs-on: ubuntu-latest
    needs: release
    env:
      PR_BRANCH_NAME: ci/update-orillusion-${{ needs.release.outputs.version }}
    steps:
      - name: Checkout NextJS repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          repository: ${{ env.WEB_NEXTJS_REPO }}
          path: ${{ env.WEB_NEXTJS_PATH }}
          ref: ${{ env.WEB_NEXTJS_BASE_BRANCH }}
          token: ${{ secrets.WEB_NEXTJS_TOKEN }}

      # Use version and tarball URL from the release job outputs
      - name: Show release info
        run: |
          echo "Using orillusion version: ${{ needs.release.outputs.version }}"
          echo "Tarball URL: ${{ needs.release.outputs.tarball_url }}"

      - name: Install latest release tarball from GitHub
        working-directory: ${{ env.WEB_NEXTJS_PATH }}
        shell: bash
        env:
          TARBALL_URL: ${{ needs.release.outputs.tarball_url }}
        run: |
          set -euo pipefail
          echo "Installing tarball from $TARBALL_URL"
          npm uninstall @orillusion/core || true
          npm install "$TARBALL_URL"

      - name: Create new branch
        run: |
          cd ${{ env.WEB_NEXTJS_PATH }}
          git checkout -b ${{ env.PR_BRANCH_NAME }}
          git push -f origin ${{ env.PR_BRANCH_NAME }}

      - name: Compose PR body (prefer associated PR)
        id: compose_pr_body
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            let prNumber = null;
            let prUrl = null;
            try {
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: sha,
              });
              if (Array.isArray(prs) && prs.length > 0) {
                prNumber = prs[0].number;
                prUrl = prs[0].html_url;
              }
            } catch (error) {
              core.info(`No associated PR found or error fetching: ${error.message}`);
            }
            const tag = process.env.TAG;
            const linkText = prNumber ? `#${prNumber}` : sha;
            const linkUrl = prNumber
              ? prUrl
              : `https://github.com/${owner}/${repo}/commit/${sha}`;
            return `Automated PR to update Orillusion to ${tag}\n\nThis PR is automatically created by the CI workflow from Orillusion ${prNumber ? 'pull request' : 'commit'} [${linkText}](${linkUrl}).`;
        env:
          TAG: ${{ needs.release.outputs.tag }}

      - name: Open PR
        uses: peter-evans/create-pull-request@v7
        with:
          path: ${{ env.WEB_NEXTJS_PATH }}
          title: "CI: Update Orillusion to ${{ needs.release.outputs.tag }} (automated PR)"
          body: ${{ steps.compose_pr_body.outputs.result }}
          branch: ${{ env.PR_BRANCH_NAME }}
          base: ${{ env.WEB_NEXTJS_BASE_BRANCH }}
          token: ${{ secrets.WEB_NEXTJS_TOKEN }}
          reviewers: handzlikchris,sayangel,jgilm,williamih
